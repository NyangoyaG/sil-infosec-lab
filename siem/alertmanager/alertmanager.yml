global:
  resolve_timeout: 1m

route:
  receiver: local-webhook
  group_by:
    - alertname
    - severity
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://sil-siem-alert-receiver:8080/alerts
        send_resolved: true
