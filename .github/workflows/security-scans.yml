
name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan API source
        run: semgrep scan --config auto api/

  dependency-audit:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r api/requirements.txt

  dast:
    name: Dynamic Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Start isolated test target
        run: |
          docker run -d --rm \
            --name dast-test-target \
            -p 127.0.0.1:8080:80 \
            nginx:stable-alpine

          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail http://127.0.0.1:8080/

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8080/"
          artifact_name: zap-dast-report
          fail_action: false
          allow_issue_writing: false

      - name: Stop isolated test target
        if: always()
        run: docker stop dast-test-target || true
